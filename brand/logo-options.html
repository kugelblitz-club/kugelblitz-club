<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kugelblitz logo options</title>
  <style>
    body{background:#dfe3f3;color:#182039;font:16px Arial,sans-serif;margin:0;padding:40px}
    h1{font:500 42px Georgia,serif;margin:0 0 8px}
    p{color:#66709a;margin:0 0 32px}
    main{margin:auto;max-width:960px}
    section{background:#fff;border:1px solid #cdd3eb;margin:20px 0;padding:20px}
    img{display:block;width:100%}
    h2{font:500 22px Georgia,serif;margin:0 0 16px}
    @media(max-width:600px){body{padding:20px}}
  </style>
</head>
<body>
  <main>
    <h1>Choose a Kugelblitz logo</h1>
    <p>Four clean directions based on the uploaded reference. The landing page stays unchanged until you choose.</p>
    <section><h2>A — Lightning between Kugel and Blitz</h2><img src="logo-option-between.svg" alt="Logo with lightning between Kugel and Blitz"></section>
    <section><h2>B — Lightning as the final Z</h2><img src="logo-option-z.svg" alt="Logo with lightning as the final Z"></section>
    <section><h2>C — Orbit, no lightning</h2><img src="logo-option-orbit.svg" alt="Logo with orbit and no lightning"></section>
    <section><h2>D — Wordmark only</h2><img src="logo-option-wordmark.svg" alt="Logo wordmark without orbit or lightning"></section>
  </main>
</body>
</html>
